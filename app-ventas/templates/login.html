<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CELUCAST · Ingreso</title>
  {% include '_head.html' %}
  <style>.cc-glow{background:radial-gradient(60% 60% at 50% 0%,rgb(var(--cc-purple)/.22),transparent 70%)}</style>
</head>
<body class="bg-cc-bg text-cc-fg min-h-screen flex flex-col justify-center items-center px-4 relative overflow-hidden">
  <div class="cc-glow absolute inset-0 pointer-events-none"></div>

  <div class="max-w-md w-full relative">
    <div class="flex items-center justify-center gap-3 mb-6">
      <div class="h-11 w-11 rounded-xl bg-gradient-to-br from-cc-purple to-fuchsia-600 grid place-items-center font-black text-white text-lg shadow-lg shadow-cc-purple/40">C</div>
      <div class="leading-none">
        <p class="text-lg font-black tracking-tight text-cc-fg">CELUCAST</p>
        <p class="text-[11px] text-cc-muted tracking-widest uppercase">Sistema de Control</p>
      </div>
    </div>

    <div class="w-full bg-cc-surface border border-cc-border rounded-2xl shadow-2xl overflow-hidden">
      <div class="h-1 bg-gradient-to-r from-cc-purpled via-cc-purple to-fuchsia-500"></div>
      <div class="p-7 sm:p-8 space-y-6">
        <div>
          <h2 class="text-xl font-bold text-cc-fg tracking-tight">Bienvenido</h2>
          <p class="text-xs text-cc-muted mt-1">Ingresa tus credenciales para continuar.</p>
        </div>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="bg-red-500/10 border border-red-500/40 text-red-300 p-3 rounded-lg text-xs text-center">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="POST" class="space-y-4">
          <div>
            <label class="block text-[11px] font-semibold text-cc-purplel uppercase tracking-widest mb-2">Usuario</label>
            <input type="text" name="username" required
              class="w-full bg-cc-card border border-cc-border rounded-lg px-4 py-3 text-sm text-cc-fg placeholder-cc-muted focus:outline-none focus:border-cc-purple focus:ring-1 focus:ring-cc-purple transition">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-cc-purplel uppercase tracking-widest mb-2">Contraseña</label>
            <input type="password" name="password" required
              class="w-full bg-cc-card border border-cc-border rounded-lg px-4 py-3 text-sm text-cc-fg placeholder-cc-muted focus:outline-none focus:border-cc-purple focus:ring-1 focus:ring-cc-purple transition">
          </div>
          <button type="submit"
            class="w-full bg-gradient-to-r from-cc-purple to-fuchsia-600 hover:from-cc-purpled hover:to-fuchsia-700 text-white text-sm font-bold py-3 rounded-lg shadow-lg shadow-cc-purple/30 transition duration-150 cursor-pointer">
            ENTRAR AL SISTEMA
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-[11px] text-cc-muted mt-6">© CELUCAST · Panel administrativo</p>
  </div>
  {% include '_theme_toggle.html' %}
</body>
</html>
